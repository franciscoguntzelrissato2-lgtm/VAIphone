    environment:
      node: 22
      xcode: latest

    scripts:
      - name: Instalar dependências
        script: |
          cd "$CM_BUILD_DIR"
          npm install --no-audit --no-fund @capacitor/core@^8 @capacitor/ios@^8 @capacitor/cli@^8

      - name: Preparar projeto iOS
        script: |
          cd "$CM_BUILD_DIR"
          test -f capacitor.config.json || { echo "capacitor.config.json não encontrado na raiz do repositório"; exit 1; }
          if [ ! -d ios/App ]; then
            ./node_modules/.bin/cap add ios --packagemanager SPM
          fi
          ./node_modules/.bin/cap sync ios
